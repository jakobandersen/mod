{% set version = environ.get('MOD_CONDA_BUILD_VERSION') %}

package:
  name: mod
  {% if version %}
  version: {{ version }}
  {% endif %}

source:
  {% if version %}
  path: {{ "../build/mod-" + version + ".tar.gz" }}
  {% endif %}

build:
  string: py{{ python | replace(".", "") }}_boost{{ libboost | replace(".", "") }}
  # Use merge_build_host to ensure the Python interpreter path is not in the
  # build folder, as it is embedded in the wrapper script.
  # See https://github.com/conda/conda-build/issues/2677
  merge_build_host: True
  skip: True  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - pkg-config
    - cmake
    # lib packages, needed here to make sure we get the exact same version
    #               as in the host environment
    - libboost-devel {{ libboost }}
    - libboost-python-devel {{ libboost }}
    - openbabel>=3.1.1  # to cut down on versions to solve for
    - python {{ python }}
    # Add both exe and py packages to the build environemnt
    # so configuration checks succeed and tests can be run.
    # exe packages
    - graphviz>=2.46.1  # to get the rsvg plugin
    - pdf2svg
    # - texlive-core
    # py packages
    - ipython
    - networkx
    - parse
  host:
    # lib packages
    - libboost-devel {{ libboost }}
    - libboost-python-devel {{ libboost }}
    - openbabel>=3.1.1  # to cut down on versions to solve for
    - coincbc
    - python {{ python }}
  run:
    # lib packages
    - libboost {{ libboost }}
    - libboost-python {{ libboost }}
    - openbabel>=3.1.1  # to cut down on versions to solve for
    - coincbc
    - python {{ python }}
    # exe packages
    - graphviz>=2.46.1  # to get the rsvg plugin
    - pdf2svg
    # - texlive-core
    - make
    # py packages
    - ipython
    - networkx
    - parse

test:
  commands:
    - mod -e "Graph.fromSMILES('O').print()"
    - mod_post --install-format
    - mod -e "Graph.fromSMILES('O').print()"
