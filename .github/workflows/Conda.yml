name: Build Conda packages
on:
  push:
    tags:
    - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  Conda-Linux:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - name: Set PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
    - name: Update apt
      run: sudo apt update
    - name: Install pip dependencies
      run: |
        sudo apt install python3-pip
        pip3 install -r pyreqs/base.txt
    - name: Install apt dependencies
      run: sudo apt install -y $(bindep -b base | tr '\n' ' ')
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake ../ -DBUILD_MOD=no -DBUILD_POST_MOD=no
    - name: Make archive
      run: cd build && make dist
    - name: Build
      run: ./scripts/makeConda.sh
    - name: Archive result
      uses: actions/upload-artifact@v7
      with:
        name: conda-linux
        path: |
          conda/conda-bld
        retention-days: 7
  Conda-Linux-upload:
    needs: Conda-Linux
    runs-on: ubuntu-22.04
    if: github.repository_owner == 'jakobandersen'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: conda-linux
        path: ./dist
    - uses: anaconda/actions/setup-anaconda-cli@v0.3.1
      id: setup-anaconda-cli
      with:
        version: latest
        tools: anaconda-cli
    - name: Upload Packages
      run: |
        $HOME/.ana/tools/anaconda-cli/bin/anaconda    \
          --token "${{ secrets.ANACONDA_ORG_TOKEN }}" \
          upload --user jakobandersen                 \
          --skip-existing ./dist/linux-64/*.conda
