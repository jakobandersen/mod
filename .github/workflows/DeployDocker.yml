name: Build and deploy Docker image

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  develop-docker:
    if: github.repository_owner == 'jakobandersen' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - name: Set PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
    - name: Update apt
      run: sudo apt update
    - name: Install pip dependencies
      run: |
        sudo apt install python3-pip
        pip3 install -r pyreqs/base.txt
    - name: Install apt dependencies
      run: sudo apt install -y $(bindep -b base | tr '\n' ' ')
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake ../ -DBUILD_MOD=no -DBUILD_POST_MOD=no
    - name: Make archive
      run: cd build && make dist
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: jakobandersen
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Ubuntu.Dockerfile
        push: true
        tags: jakobandersen/mod:develop
  release-docker:
    if: github.repository_owner == 'jakobandersen' && startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - name: Set PATH
      run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
    - name: Update apt
      run: sudo apt update
    - name: Install pip dependencies
      run: |
        sudo apt install python3-pip
        pip3 install -r pyreqs/base.txt
    - name: Install apt dependencies
      run: sudo apt install -y $(bindep -b base | tr '\n' ' ')
    - name: Bootstrap
      run: ./bootstrap.sh
    - name: Configure
      run: |
        mkdir build
        cd build
        cmake ../ -DBUILD_MOD=no -DBUILD_POST_MOD=no
    - name: Make archive
      run: cd build && make dist
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: jakobandersen
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: docker/Ubuntu.Dockerfile
        push: true
        tags: jakobandersen/mod:${{github.ref_name}},jakobandersen/mod:latest
