name: Build and deploy Docker image

on:
  push:
    branches:
    - develop
    tags:
    - "v*"

concurrency:
  group: ci-${{ github.repository }}-dockerhub

jobs:
  develop-docker:
    if: github.repository_owner == 'jakobandersen' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu:22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: jakobandersen
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Ubuntu.Dockerfile
        push: true
        tags: jakobandersen/mod:develop
  release-docker:
    if: github.repository_owner == 'jakobandersen' && startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu:22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: 'recursive'
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: jakobandersen
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Ubuntu.Dockerfile
        push: true
        tags: jakobandersen/mod:${{github.ref_name}},jakobandersen/mod:latest
